<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="5" fill="#221e19"/>
  <!-- skull dome -->
  <ellipse cx="16" cy="15" rx="8.5" ry="8" fill="#f6f1e6"/>
  <!-- jaw -->
  <rect x="10" y="20" width="12" height="6" rx="2" fill="#f6f1e6"/>
  <!-- eye sockets -->
  <ellipse cx="12.8" cy="14.5" rx="2.6" ry="2.8" fill="#221e19"/>
  <ellipse cx="19.2" cy="14.5" rx="2.6" ry="2.8" fill="#221e19"/>
  <!-- nose cavity -->
  <path d="M15.2 18.5 L16.8 18.5 L16 16.8Z" fill="#221e19"/>
  <!-- teeth gaps -->
  <rect x="10" y="22.5" width="2.8" height="3.5" rx="0.5" fill="#221e19"/>
  <rect x="14.6" y="22.5" width="2.8" height="3.5" rx="0.5" fill="#221e19"/>
  <rect x="19.2" y="22.5" width="2.8" height="3.5" rx="0.5" fill="#221e19"/>
  <!-- red dot accent -->
  <circle cx="26" cy="6" r="3" fill="#b2402b"/>
</svg>
